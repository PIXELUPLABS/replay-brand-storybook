  --b-sky:#499df8; --b-olive:#54702f; --b-sun:#eae058; --b-bar:#7e7e7e; --b-red:#bf000f; --b-teal:#0e9692; --b-body:#727272; --b-read:#565656; --b-strong:#a8a8a8; --b-rule:#d4d4d4;
  --b-grad:linear-gradient(180deg,#133264 27%,#147dba 144%);
  --b-bar-grad:linear-gradient(90deg,#499df8 0 24.33%,#54702f 24.33% 43.24%,#7e7e7e 43.24% 70.27%,#eae058 70.27% 73.87%,#499df8 73.87% 79.28%,#54702f 79.28%);
  --t-noise:url("assets/tex/colour-bar-noise.webp"); --t-fibre:url("assets/tex/fibre-blue.webp"); --t-fibre-grey:url("assets/tex/fibre-neutral.webp");
  --t-guil:url("assets/tex/guilloche.webp"); --t-guil-fine:url("assets/tex/guilloche-fine.webp"); --t-weave:url("assets/tex/weave.webp"); --t-redact:url("assets/tex/redaction.webp");
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --frame:#1a1b1e; --line:#2c2e33; --line-2:#44474e;
    --text:#f1f1f2; --read:#c9cacf; --muted:#9a9ca3; --label:#8b8e96; --accent:#499df8; --grain-blend:overlay;
    --gridline:rgba(241,241,242,.06); --guide:rgba(241,241,242,.17); --dont:#ff5a64; --do:#9cbf6b; --hover-fill:#24262b; --stage:#26272b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --frame:#1a1b1e; --line:#2c2e33; --line-2:#44474e;
  --text:#f1f1f2; --read:#c9cacf; --muted:#9a9ca3; --label:#8b8e96; --accent:#499df8; --grain-blend:overlay;
  --gridline:rgba(241,241,242,.06); --guide:rgba(241,241,242,.17); --dont:#ff5a64; --do:#9cbf6b; --hover-fill:#24262b; --stage:#26272b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 20px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.4;letter-spacing:-.01em;
  background-color:var(--bg);background-image:var(--grain);background-size:259px 259px;background-blend-mode:var(--grain-blend)}
img,video{max-width:100%;display:block}
a{color:inherit}
button,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;animation-delay:0s!important;scroll-behavior:auto!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-right:1px dashed var(--line);display:flex;flex-direction:column;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 20px}
.brandmark{display:block;color:var(--text);text-decoration:none;width:112px}
.brandmark svg{display:block;width:100%;height:auto}
.hubmeta{margin:16px 0 28px;font-family:var(--f-mono);font-size:10px;line-height:1.6;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav{list-style:none;margin:0;padding:0;flex:1}
.nav > li{margin:0 0 1px}
.nav a.top{display:grid;grid-template-columns:30px 1fr;align-items:baseline;padding:7px 8px;text-decoration:none;font-size:14.5px;color:var(--muted);transition:color 150ms var(--ease-snap),background-color 150ms var(--ease-snap)}
.nav a.top span{font-family:var(--f-mono);font-size:11px}
.nav a.top:hover,.nav li.on > a.top{color:var(--text)}
.nav li.on > a.top{background:var(--hover-fill)}
.nav ul{list-style:none;margin:4px 0 12px;padding:0 0 0 38px;display:none}
.nav li.on ul{display:block}
.nav ul a{display:grid;grid-template-columns:30px 1fr;padding:4px 8px;font-size:13.5px;color:var(--muted);text-decoration:none;border-left:1px dashed var(--line);transition:color 150ms var(--ease-snap)}
.nav ul a i{font-style:normal;font-family:var(--f-mono);font-size:10.5px}
.nav ul a:hover{color:var(--text)}
.nav ul a.cur{color:var(--text);border-left:1px solid var(--text)}
.side-foot{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px dashed var(--line);margin-top:18px}
.theme-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{border:0;background:transparent;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted);transition:background-color 150ms var(--ease-snap),color 150ms var(--ease-snap)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.topbar{display:none}
main{min-width:0;padding:0 clamp(16px,4vw,56px);display:flex;flex-direction:column}
.page{max-width:1560px;width:100%;margin-inline:auto}

/* footer: Night panel with the colour bar at its head */
.credit{margin:72px calc(-1 * clamp(16px,4vw,56px)) 0;margin-top:auto;padding-top:72px}
.credit-in{position:relative;background:var(--b-night);color:#9c9c9c;padding:28px max(clamp(16px,4vw,56px),calc((100% - 1560px) / 2)) 30px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 32px}
.credit-mark{width:132px;color:#fff}
.credit-mark svg{display:block;width:100%;height:auto}
.credit-links{display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.credit-links a{color:#9c9c9c;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;padding-bottom:2px;transition:color 150ms var(--ease-snap),background-size 300ms var(--ease-snap)}
.credit-links a:hover{color:#fff;background-size:100% 1px}
.credit-links a:focus-visible{outline-color:#fff}
.cbar-line{height:9px;background:var(--t-noise) 0 0/auto 100% repeat,var(--b-bar-grad);background-blend-mode:soft-light,normal}

/* ---------- section tag (eyebrow) ---------- */
.tag{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:5px 10px;border:1px solid var(--line-2);font-family:var(--f-mono);font-size:10px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.dashed{border-style:dashed}

/* ---------- buttons: secondary is a bordered Ink rectangle; primary is Ink with the site's hover stack ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--text);background:var(--frame);color:var(--text);padding:9px 14px;font-family:var(--f-body);font-size:13px;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:background-color 150ms var(--ease-snap),color 150ms var(--ease-snap),transform 150ms var(--ease-snap)}
.btn:active{transform:scale(.98)}
.btn svg{width:14px;height:14px;flex:none}
.btn.block{width:100%;justify-content:center}
.btn.mini{padding:4px 9px;font-size:12px;gap:6px}
.btn.mini svg{width:12px;height:12px}
.btn.icon{padding:6px;gap:0}
.btn.icon svg{width:14px;height:14px}
.btn[disabled]{opacity:.6;cursor:wait}
@media (hover:hover) and (pointer:fine){.btn:not(.solid):hover{background:var(--hover-fill)}}
.btn.solid,.cta{isolation:isolate;overflow:hidden;background:var(--text);color:var(--bg);border-color:var(--text);font-family:var(--f-head);font-weight:400;text-transform:none;letter-spacing:.01em;font-size:14px;line-height:1;padding:11px 16px;transition:color 300ms var(--ease-snap),transform 150ms var(--ease-snap)}
.btn.solid .hs,.cta .hs{position:absolute;inset:0;z-index:-1;opacity:0;background:var(--t-weave) 0 0/185px 185px,var(--b-grad);background-blend-mode:soft-light,normal;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.3);transition:opacity 300ms var(--ease-snap);pointer-events:none}
.btn.solid .st,.cta .st{position:absolute;top:0;bottom:0;width:6px;z-index:-1;background:url("assets/ui/strip-left.svg") center/cover no-repeat;transition:transform 300ms var(--ease-snap);pointer-events:none}
.btn.solid .st.l,.cta .st.l{left:0;transform:translateX(-100%)}
.btn.solid .st.r,.cta .st.r{right:0;transform:translateX(100%);background-image:url("assets/ui/strip-right.svg")}
@media (hover:hover) and (pointer:fine){
  .btn.solid:hover,.cta:hover{color:#fff}
  .btn.solid:hover .hs,.cta:hover .hs{opacity:1}
  .btn.solid:hover .st,.cta:hover .st{transform:none}
}
.btn.solid:active .hs,.cta:active .hs{opacity:1}
.btn.solid:active .st,.cta:active .st{transform:none}
.btn.solid:active,.cta:active{color:#fff;transform:scale(.98)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* corner fold: a 16px Ink triangle that turns Sky on hover */
.fold{position:relative}
.fold::after{content:"";position:absolute;top:-1px;right:-1px;width:16px;height:16px;background:linear-gradient(225deg,var(--text) 50%,transparent 50%);transition:background 150ms var(--ease-snap);pointer-events:none}
.fold:hover::after,.fold:focus-within::after{background:linear-gradient(225deg,var(--b-sky) 50%,transparent 50%)}

/* ---------- the guideline page ---------- */
.gp{padding:0 0 64px;border-bottom:1px dashed var(--line)}
.meta{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;font-family:var(--f-mono);font-size:12px;color:var(--text);padding:16px 0 14px;border-bottom:1px dashed var(--line);margin-bottom:30px}
.meta span:first-child{letter-spacing:.04em}
.meta span:nth-child(2){text-align:center;color:var(--muted)}
.meta span:last-child{text-align:right;color:var(--muted)}
.meta b{font-weight:500;margin-left:14px;color:var(--text)}
.gp-grid{display:grid;grid-template-columns:minmax(0,25%) minmax(0,1fr);gap:24px 48px}
.gp-copy h2{font-family:var(--f-head);font-weight:400;font-size:clamp(32px,3.2vw,46px);line-height:1.15;letter-spacing:-.04em;margin:-6px 0 18px;text-wrap:balance}
.gp-copy p{margin:0 0 14px;font-weight:300;font-size:15.5px;line-height:1.4;letter-spacing:0;color:var(--read);max-width:44ch}
.gp-copy p b{display:block;font-weight:500;color:var(--text)}
.gp-copy .tag{margin-bottom:18px}
.art{border:1px dashed var(--line);background:var(--frame);overflow:hidden}
.art img{width:100%;height:auto}
.tools{margin-top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.tools .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}

/* divider pages: 2.0 Logo, 3.0 Colour ... */
.divider{padding:0;border-bottom:0}
.divider-in{padding:0 0 clamp(64px,11vw,160px)}
.divider .tag{margin:clamp(24px,4vw,48px) 0 0 clamp(0px,1.5vw,24px)}
.divider h1{font-family:var(--f-head);font-weight:400;font-size:clamp(54px,13vw,200px);line-height:1;letter-spacing:-.04em;margin:18px 0 0 clamp(0px,1.5vw,24px);overflow-wrap:anywhere}
.divider p{margin:28px 0 0 clamp(0px,1.5vw,24px);max-width:58ch;font-weight:300;font-size:17px;color:var(--read)}
.divider .btnrow{margin:22px 0 0 clamp(0px,1.5vw,24px)}

/* ---------- home ---------- */
.ov,.toc{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:24px 48px}
.ov h2,.toc h2{font-family:var(--f-head);font-weight:400;font-size:clamp(34px,3.6vw,56px);line-height:1.25;letter-spacing:-.04em;margin:-6px 0 0}
.ov p{margin:0 0 16px;font-weight:300;font-size:18px;line-height:1.38;letter-spacing:0;color:var(--read);max-width:56ch}
.toc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px 56px}
.toc-group h3{font-family:var(--f-body);font-weight:500;font-size:15px;margin:0 0 6px}
.toc-group a{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:15px;font-weight:300;text-decoration:none;color:var(--read);border-bottom:1px dashed transparent;transition:color 150ms var(--ease-snap),border-color 150ms var(--ease-snap)}
.toc-group a:hover{color:var(--text);border-bottom-color:var(--line)}
.toc-group a span:last-child{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}

/* cover, built from the brand pieces: fibre-blue field, mark arcs, colour-bar strips, stepped stripes */
.cover{position:relative;margin:20px 0 0;border:1px dashed var(--line);overflow:hidden;aspect-ratio:16/9;container-type:inline-size;isolation:isolate;color:#fff;
  background:var(--b-deep) url("assets/cover-art.webp") center/cover no-repeat}
/* artwork rendered from the Figma cover (1.0); the title and signature stay live, placed on Figma's coordinates (1920 x 1080 frame) */
.cover h1{position:absolute;left:3.745cqi;top:4.708cqi;margin:0;font-family:var(--f-head);font-weight:400;font-size:10.229cqi;line-height:10.417cqi;letter-spacing:-.022em;color:#fff}
.cover .cv-sig{position:absolute;left:3.6cqi;top:48.6cqi;width:13.35cqi;color:#fff}
.cover .cv-sig svg{display:block;width:100%;height:auto}

/* ---------- in action: mockup gallery ---------- */
.gal{columns:3 260px;column-gap:14px}
.gal figure{break-inside:avoid;margin:0 0 14px}
.gal .tile{position:relative;display:block;width:100%;padding:0;border:1px dashed var(--line);background:#111;cursor:zoom-in;overflow:hidden}
.gal .tile img{width:100%;height:auto;transition:transform 500ms var(--ease-snap)}
@media (hover:hover) and (pointer:fine){.gal .tile:hover img{transform:scale(1.02)}}
.gal figcaption{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gal figcaption span{display:flex;gap:10px;min-width:0}
.gal figcaption b{font-weight:400;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{position:fixed;inset:0;z-index:60;background:var(--scrim);color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity 200ms var(--ease-snap)}
.lb.on{opacity:1}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9c9c9c}
.lb-top b{color:#fff;font-weight:400}
.lb-stage{position:relative;min-height:0}
.lb-stage img{position:absolute;inset:14px 0;margin:auto;max-width:100%;max-height:calc(100% - 28px);object-fit:contain;transform:scale(.98);transition:transform 200ms var(--ease-snap)}
.lb.on .lb-stage img{transform:none}
.lb .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.lb .btn:hover{background:rgba(255,255,255,.08)}
.lb :focus-visible{outline-color:#fff}

/* ---------- resources ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dl .card{border:1px solid var(--line-2);background:var(--frame);padding:20px;display:flex;flex-direction:column;gap:8px}
.dl h3{font-family:var(--f-head);font-weight:400;font-size:24px;letter-spacing:-.01em;line-height:1.1;margin:0}
.dl p{margin:0 0 10px;color:var(--muted);font-size:14px;flex:1}
.dl small{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.texgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.texgrid figure{margin:0}
.texgrid .sw{aspect-ratio:1;border:1px dashed var(--line);background-size:cover;background-position:center}
.texgrid figcaption{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:6px}
pre.code{background:var(--frame);border:1px dashed var(--line);padding:16px;font-family:var(--f-mono);font-size:12px;line-height:1.6;max-height:380px;overflow:auto;white-space:pre-wrap;margin:0 0 12px}
/* tabs: bordered serif cells; an Ink fill slides to the selected one */
.tabs{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border:1px solid var(--line-2);margin:0 0 12px}
.tabs .tab-ind{position:absolute;top:0;bottom:0;left:0;width:calc(100% / var(--n));background:var(--text);transform:translateX(calc(var(--k) * 100%));transition:transform 200ms var(--ease-swift)}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:12px 10px;font-family:var(--f-head);font-size:16px;letter-spacing:-.01em;cursor:pointer;color:var(--text);transition:color 200ms var(--ease-swift)}
.tabs button + button{border-left:1px solid var(--line-2)}
.tabs button[aria-selected="true"]{color:var(--bg)}
.prompts{list-style:none;margin:0;padding:0;border-top:1px dashed var(--line)}
.prompts li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:14px 0;border-bottom:1px dashed var(--line)}
.prompts .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:3px}
.prompts h3{margin:0 0 4px;font-family:var(--f-head);font-weight:400;font-size:20px;letter-spacing:-.01em}
.prompts p{margin:0;font-size:14px;line-height:1.45;color:var(--read)}

/* ======================================================================
   Artboards
   ====================================================================== */
.board{position:relative;border:1px dashed var(--line);background-color:var(--frame);color:var(--text);container-type:inline-size;overflow:hidden}
.board.grid{background-image:linear-gradient(90deg,var(--gridline) 1px,transparent 1px),linear-gradient(0deg,var(--gridline) 1px,transparent 1px);background-size:calc(100% / 6) calc(100% / 4);background-position:-1px -1px}
.board + .board{margin-top:12px}
.r43{aspect-ratio:4/3}
.b-center{position:absolute;inset:0;display:grid;place-items:center}
.b-sig{width:78%;height:auto;display:block}
.b-mark{width:38%;height:auto;display:block}
.board > svg.dia{display:block;width:100%;height:auto}
.mlab{font-family:var(--f-mono);font-size:10px;line-height:1.5;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.stk{font-family:var(--f-head);font-weight:400}
.play-hint{position:absolute;right:8px;bottom:8px;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:4px 7px;background:rgba(8,8,8,.72);color:#fff;font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity 200ms var(--ease-snap)}
.play-hint::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
[data-play]:hover .play-hint,[data-video].on .play-hint{opacity:0}
@media (hover:none){.play-hint .h{display:none}}
@media (hover:hover){.play-hint .t{display:none}}

/* diagram strokes */
.g-lines line{stroke:var(--guide);stroke-width:1;vector-effect:non-scaling-stroke}
.g-dim{color:var(--accent)}
.g-dim path,.g-dim line{stroke:currentColor;fill:none;stroke-width:1.25;vector-effect:non-scaling-stroke}
.g-dim text{fill:currentColor;font-family:var(--f-mono);font-size:21px;letter-spacing:.04em}
.g-zone{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.hatch-l{stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}
.g-lab{fill:var(--muted);font-family:var(--f-mono);font-size:19px;letter-spacing:.04em}
.g-tick{stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}

/* 2.5 scalability */
.scale .sc-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px clamp(14px,2.5vw,24px) 18px;border-bottom:1px dashed var(--line)}
.scale .sc-row:last-child{border-bottom:0}
.sc-logo{flex:1;min-width:0}
.sc-logo svg{display:block;width:calc(var(--h) * 3.952);max-width:100%;height:auto}
.scale .mlab{white-space:nowrap;flex:none;font-size:9.5px}

/* 2.6 incorrect usage */
.misuse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.misuse figure{margin:0;padding:clamp(18px,4cqi,40px) clamp(8px,2cqi,22px) 14px;border-right:1px dashed var(--line);border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.misuse figure:nth-child(3n){border-right:0}
.misuse figure:nth-last-child(-n+3){border-bottom:0}
.misuse svg{display:block;width:100%;height:auto}
.misuse figcaption{font-family:var(--f-mono);font-size:max(8.5px,1.25cqi);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}

/* 3.1 brand palette */
.pal-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:6px}
.pal-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.swb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:clamp(170px,30cqi,300px);padding:clamp(10px,1.6cqi,16px);background:var(--c);color:#fff;position:relative}
.swb.lt{color:var(--b-ink);box-shadow:inset 0 0 0 1px rgba(20,21,24,.08)}
.swb::after{content:"Copy";position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity 150ms var(--ease-snap)}
.swb:hover::after,.swb:focus-visible::after{opacity:.75}
.swb:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.sw-n{font-size:max(11px,1.25cqi);line-height:1.2}
.sw-h{font-family:var(--f-mono);font-size:max(10px,1.05cqi);margin-top:4px}
.sw-r{font-size:max(10px,1cqi);opacity:.8}
.pal-lab{display:flex;align-items:center;gap:14px;margin:0;padding:12px clamp(10px,1.6cqi,16px);font-family:var(--f-mono);font-size:12px;color:var(--text)}
.pal-lab::after{content:"";flex:1;border-top:1px dashed var(--line)}
.pal-lab.caps{text-transform:uppercase;letter-spacing:.08em}
.pal-acc{border-top:1px dashed var(--line);padding:clamp(14px,2cqi,22px) clamp(12px,2cqi,22px) clamp(16px,2.4cqi,26px)}
.acc-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-top:14px}
.acc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--text)}
.acc i{display:block;aspect-ratio:1/1.32;background:var(--c);margin-bottom:6px;transition:outline-color 150ms}
.acc:hover i{outline:1px solid var(--text);outline-offset:2px}
.acc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.acc .sw-h,.acc .sw-r{color:var(--muted);opacity:1}

/* 3.2 neutrals and surfaces */
.surf-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.surf-row .swb{min-height:clamp(200px,40cqi,380px);overflow:hidden}
.surf-row .swb .sw-n{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;font-size:max(10.5px,1.1cqi)}
.surf-row .swb.tex::before{content:"";position:absolute;inset:0;background:var(--t-guil-fine) center/560px;filter:invert(1);mix-blend-mode:screen;opacity:.09;pointer-events:none}
.surf-row .swb > span{position:relative}
.util{background:var(--b-mist);color:var(--b-ink);padding:clamp(14px,2cqi,22px) clamp(12px,2cqi,22px) clamp(16px,2.4cqi,26px)}
.util .mlab{color:var(--b-body)}
.util-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px 16px;margin-top:14px}
.util .acc{color:var(--b-ink)}
.util .acc i{aspect-ratio:2.7/1}
.util .acc .sw-n{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.util .acc .sw-h,.util .acc .sw-r{color:var(--b-body)}
.util .acc.white i{box-shadow:inset 0 0 0 1px rgba(20,21,24,.1)}
.util .acc:hover i{outline-color:var(--b-ink)}

/* shared: brand cards for 3.3 and 3.4 */
.cbar{position:absolute;left:0;right:0;bottom:0;height:max(5px,1.6cqi);background:var(--t-noise) 0 0/auto 100% repeat,var(--b-bar-grad);background-blend-mode:soft-light,normal}
.weave-blue{background:var(--t-weave) 0 0/185px,var(--b-grad);background-blend-mode:soft-light,normal}
.eb{display:inline-block;align-self:flex-start;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;border:1px dashed var(--b-strong);padding:.4em .75em;line-height:1.2}
.cta{position:relative;display:inline-block;align-self:flex-start;background:var(--b-ink);color:#fff;border:0;padding:.75em 1.15em;cursor:default}

/* 3.3 colour in use */
.uses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;padding:clamp(12px,2cqi,22px)}
.uses figure{margin:0;min-width:0}
.uses figcaption{font-family:var(--f-mono);font-size:max(10px,1.05cqi);color:var(--muted);margin-top:8px}
.uses figcaption b{font-weight:500;color:var(--text)}
.uc{position:relative;aspect-ratio:375/277;overflow:hidden;container-type:inline-size}
.uc-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 6.5cqi}
.uc .eb{font-size:max(8px,1.8cqi);margin-bottom:3.4cqi}
.uc h4{margin:0 0 3.2cqi;font-family:var(--f-head);font-weight:400;font-size:7.1cqi;line-height:1.1;letter-spacing:-.03em;max-width:13em;text-wrap:balance}
.uc .big{font-size:10cqi;line-height:1;letter-spacing:-.03em}
.uc p{margin:0 0 3.4cqi;font-size:max(10.5px,2.85cqi);line-height:1.4;max-width:30em}
.uc .cta{font-size:max(9.5px,2.15cqi)}
.uc.paper{background:var(--b-paper);color:var(--b-ink);box-shadow:inset 0 0 0 1px var(--b-rule)}
.uc.paper p{color:var(--b-body)}
.uc.mist{background:var(--b-mist);color:var(--b-ink);box-shadow:inset 0 0 0 1px var(--b-strong)}
.uc.mist p{color:var(--b-read)}
.uc .dr{position:absolute;left:6.5cqi;right:6.5cqi;border-top:1px dashed var(--b-strong)}
.uc.night{background:var(--b-night);color:#fff}
.uc.night p{color:rgba(255,255,255,.82)}
.uc.night .eb{border-color:rgba(255,255,255,.35)}
.uc.night .dr{border-color:rgba(255,255,255,.22)}
.uc.blue{color:#fff}
.uc.blue p{color:rgba(255,255,255,.85)}
.uc.blue .eb{border-color:rgba(255,255,255,.4)}

/* 3.4 usage principles */
.princ{padding:clamp(16px,3cqi,34px) clamp(14px,2.6cqi,30px) clamp(18px,3cqi,36px);display:grid;gap:clamp(22px,4cqi,48px)}
.princ h3{margin:0 0 12px;font-family:var(--f-head);font-weight:400;font-size:clamp(17px,2cqi,24px);letter-spacing:-.02em}
.pr-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pr-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2.4cqi,24px)}
.dd{min-width:0}
.dd-l{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dd-l i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.dd-l.dont{color:var(--dont)}
.dd-l.do{color:var(--do)}
.pc{position:relative;overflow:hidden;container-type:inline-size;display:flex;flex-direction:column;justify-content:center}
.pc.wide{aspect-ratio:371/194;padding:0 3%}
.pc.wide h4{margin:0;font-family:var(--f-head);font-weight:400;font-size:7.7cqi;line-height:1.1;letter-spacing:-.03em;max-width:11em}
.pc.tall{aspect-ratio:177/195;padding:0 7%}
.pc.tall h4{margin:0 0 5cqi;font-family:var(--f-head);font-weight:400;font-size:10.4cqi;line-height:1.08;letter-spacing:-.02em}
.pc.tall p{margin:0;font-size:max(9px,5.2cqi);line-height:1.4}
.pc.tall .cta{font-size:max(9px,5.2cqi)}
.pc.paper{background:var(--b-paper);color:var(--b-ink);box-shadow:inset 0 0 0 1px var(--b-rule)}
.pc.paper p{color:var(--b-body)}
.pc.sky{background:var(--b-sky);color:var(--b-ink)}
.pc.royal{background:#2f5bff;color:#fff}
.pc.royal .cta{background:#fff;color:#2f5bff}
.pc.blue{color:#fff}
.pc.cramped h4{max-width:7.6em}
.pc.cramped p{color:#bdbdbd!important}

/* 4.x type specimens */
.spec{padding:clamp(16px,3cqi,32px) clamp(16px,3cqi,32px) clamp(20px,4cqi,40px);display:flex;flex-direction:column}
.spec-big{margin:0;font-size:19.6cqi;line-height:1;letter-spacing:-.04em;white-space:nowrap}
.spec-big.sans{font-family:var(--f-body);font-weight:400;letter-spacing:-.05em}
.spec hr{border:0;border-top:1px dashed var(--line);margin:clamp(28px,8cqi,90px) 0 clamp(20px,5cqi,56px)}
.spec .mlab{margin-bottom:clamp(12px,2.4cqi,28px)}
.spec-set{margin:0;font-size:5.25cqi;line-height:1.12;letter-spacing:-.02em;overflow-wrap:anywhere}
.spec-set.sans{font-family:var(--f-body);letter-spacing:-.03em;font-feature-settings:"calt" 0}
.spec-mono{margin:clamp(14px,2.4cqi,26px) 0 0;font-family:var(--f-mono);font-size:max(10px,2.1cqi);line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.wts{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:0 0 clamp(16px,3cqi,32px);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:clamp(8px,1.6cqi,16px) 0}
.wts span{font-size:max(15px,4cqi);line-height:1.1;letter-spacing:-.02em;text-align:center}
.wts small{display:block;font-family:var(--f-mono);font-size:max(8px,1cqi);font-weight:400;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.fb{padding:clamp(16px,3cqi,32px)}
.fb .mlab{font-size:9px}
.fb-s{margin:clamp(4px,1cqi,10px) 0 0;font-size:16.5cqi;line-height:1.08;letter-spacing:-.01em;white-space:nowrap}
.fb hr{border:0;border-top:1px dashed var(--line);margin:clamp(18px,5cqi,56px) 0}
.fontcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;border:1px dashed var(--line);padding:12px 14px;width:100%}
.fontcard p{margin:0;font-size:13px;color:var(--muted)}
.fontcard b{display:block;font-weight:500;font-size:14px;color:var(--text)}

/* 4.3 type-setting */
.ts{padding:clamp(14px,2.6cqi,30px) clamp(14px,2.6cqi,30px) clamp(8px,1.6cqi,18px)}
.ts-row{padding:0 0 clamp(18px,3.2cqi,36px)}
.ts-row + .ts-row{padding-top:clamp(4px,.8cqi,10px)}
.ts-spec{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ts-spec .mlab{font-size:9.5px;letter-spacing:.07em}
.ts-sample{margin:0;color:var(--text);overflow-wrap:anywhere}
.ts-foot{border-top:1px solid var(--line-2);margin-top:4px}

/* 5.1 illustrations */
.illo{padding:clamp(14px,2cqi,22px);display:grid;gap:clamp(14px,2.4cqi,24px)}
.illo-row{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(8px,1.2cqi,12px);align-items:start}
.illo-l{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.35;color:var(--text)}
.illo figure{position:relative;margin:0;overflow:hidden}
.illo img{width:100%;height:auto}
.vid{background:#1c1c1c;cursor:pointer}
.vid video{position:absolute;left:0;top:0;width:100%;height:auto;opacity:0;transition:opacity 250ms var(--ease-snap)}
.vid.on video{opacity:1}
.vid::after{content:"";position:absolute;inset:0;z-index:1;background:var(--t-weave) 0 0/140px;mix-blend-mode:screen;opacity:0;transition:opacity 250ms var(--ease-snap);pointer-events:none}
.vid.on::after{opacity:.13}

/* industries diagram: a port of the site's industries-diagram.tsx, framed and gridded like the Figma export */
.ind{position:relative;aspect-ratio:1402/1194;background:#efefef;overflow:hidden;cursor:pointer}
.ind-grid{position:absolute;inset:0;width:100%;height:100%;display:block}
.ind-grid line{stroke:rgba(0,0,0,.075);stroke-width:1;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.ind-in{position:absolute;left:9.836%;top:4.472%;width:83.995%;aspect-ratio:665/611;container-type:inline-size}
.ind-panel,.ind-bar,.ind-core,.ind-card{position:absolute}
.ind-panel{background:#dddde3;border:.5px dashed rgba(0,0,0,.7);overflow:hidden}
.ind-panel::before{content:"";position:absolute;inset:0;background:url("assets/tex/industries-guilloche.webp") 0 0/209.64% 154.29% no-repeat;mix-blend-mode:multiply;opacity:.48}
.ind-bar{background-color:#c0c0c8;background-image:var(--grain);background-size:160px;background-blend-mode:multiply}
.ind-core{border:.5px dashed rgba(0,0,0,.7);background-color:#dddee4;background-image:var(--grain);background-size:160px;background-blend-mode:multiply}
.ind-blue{position:absolute;background:url("assets/tex/canvas.webp") 0 0/149.75% 149.75%,linear-gradient(180deg,#133264 26.5%,#147dba 144%);background-blend-mode:soft-light,normal}
.ind-card{width:19.0977cqw;height:19.0977cqw;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:1.8045cqw;border:.5px dashed rgba(0,0,0,.7);background-color:#eaebf1;background-image:var(--grain);background-size:160px;background-blend-mode:multiply;color:#090909}
.ind-card svg{width:2.406cqw;height:2.406cqw;flex:none}
.ind-card span{font-family:var(--f-head);font-size:2.1053cqw;line-height:1.5;letter-spacing:-.025em;white-space:nowrap}
.ind.playing .ind-card{animation:ind-in 700ms cubic-bezier(0,0,.2,1) both;animation-delay:var(--d)}
@keyframes ind-in{from{transform:translate(var(--ox),var(--oy))}}

/* 5.2 data visualisation */
.dv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:clamp(16px,4cqi,48px) clamp(14px,2cqi,22px) clamp(20px,5cqi,60px);align-items:start}
.dv figure{position:relative;margin:0;min-width:0;cursor:pointer}
.dv .dv-b{margin-top:clamp(0px,18cqi,220px)}
.ch-a{position:relative;aspect-ratio:1731/1398;container-type:inline-size;overflow:hidden;background:#109c94 var(--t-weave) 0 0/12cqw;background-blend-mode:soft-light}
.ch-a .rule{position:absolute;left:0;width:96.8%;top:1.1%;height:2.1%;border-top:.3cqw solid #1fe3e1;border-bottom:.3cqw solid #1fe3e1;transform-origin:left}
.ch-a .tick{position:absolute;top:1.1%;height:2.1%;border-left:.3cqw solid #1fe3e1}
.ch-a .gl{position:absolute;top:11.4%;bottom:5.2%;border-left:1px dashed rgba(255,255,255,.4);transform-origin:top}
.ch-a .bar{position:absolute;height:6.3%;background:rgba(214,226,224,var(--o));box-shadow:inset 0 0 0 .45cqw rgba(214,228,226,.55)}
.ch-a .bar::before{content:"";position:absolute;inset:16% 1.2%;border:1px dashed rgba(14,150,146,.75);border-left-style:solid;border-right-style:solid}
.ch-a .bar.hi{background:#fff;box-shadow:inset 0 0 0 .45cqw #fff}
.ch-a .dot{position:absolute;width:1.25cqw;height:1.25cqw;margin:-.625cqw 0 0 -.625cqw;background:#fff;border-radius:50%}
.ch-a.playing .rule,.ch-a.playing .tick{animation:grow-x 600ms var(--ease-snap) both}
.ch-a.playing .gl{animation:grow-y 700ms var(--ease-snap) both;animation-delay:calc(var(--i) * 40ms)}
.ch-a.playing .bar{animation:wipe-in 650ms var(--ease-snap) both;animation-delay:calc(250ms + var(--i) * 90ms)}
.ch-a.playing .dot{animation:dot-in 300ms var(--ease-snap) both;animation-delay:calc(1000ms + var(--i) * 70ms)}
@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes grow-y{from{transform:scaleY(0)}}
@keyframes wipe-in{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes dot-in{from{opacity:0;transform:scale(.3)}}
.ch-b{position:relative;aspect-ratio:1500/1352;container-type:inline-size;overflow:hidden;background:var(--t-weave) 0 0/20cqw,var(--b-grad);background-blend-mode:soft-light,normal}
.ch-b-in{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8.7%;padding:10% 12.9% 10.3%}
.ch-b .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 2.4cqw;min-width:0}
.ch-b .col::before,.ch-b .col::after{content:"";position:absolute;top:0;bottom:0;width:2cqw;border-top:1px dashed rgba(255,255,255,.3);border-bottom:1px dashed rgba(255,255,255,.3)}
.ch-b .col::before{left:0;border-left:1px dashed rgba(255,255,255,.3)}
.ch-b .col::after{right:0;border-right:1px dashed rgba(255,255,255,.3)}
.ch-b .v{margin:0 0 2.6cqw;font-family:var(--f-head);font-size:4.7cqw;line-height:1.05;color:#fafafa;letter-spacing:-.02em;white-space:nowrap}
.ch-b .blk{height:3.73cqw;margin-top:1.07cqw;background:var(--t-weave) 0 0/20cqw,var(--bc);background-blend-mode:soft-light,normal}
.ch-b .v + .blk{margin-top:0}
.ch-b .pp{margin:0;padding:4.2cqw 0 2.4cqw;font-family:var(--f-mono);font-size:max(6px,1.55cqw);letter-spacing:.09em;text-transform:uppercase;color:#dddddd;text-align:center;white-space:nowrap}
.ch-b.playing .v{animation:tier-v 500ms cubic-bezier(0,0,.2,1) both;animation-delay:calc(var(--t) * 150ms)}
.ch-b.playing .blk{animation:tier-b 500ms cubic-bezier(0,0,.2,1) both;animation-delay:calc(var(--r) * 90ms)}
@keyframes tier-v{from{opacity:0;transform:translateX(-24px)}}
@keyframes tier-b{from{opacity:0;transform:translateY(16px)}}

/* 5.3 background */
.bgx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;padding:clamp(18px,5cqi,56px) clamp(14px,4cqi,46px)}
.bgx .tx{aspect-ratio:372/232;background-position:center;background-size:cover}
.bgx .tx.guil{grid-column:2;grid-row:1 / span 2;aspect-ratio:auto;background:#fff var(--t-guil) center/cover}
.bgx .fibre-blue{background-image:var(--t-fibre)}
.bgx .fibre-grey{background-image:var(--t-fibre-grey)}
.bgx .mlab{font-size:10.5px;color:var(--text);margin-top:4px;text-transform:none;letter-spacing:.02em}

/* 5.4 de-identification, from Figma 7689:15866 */
.deid{display:grid;gap:clamp(22px,4cqi,40px);padding:clamp(16px,3cqi,34px) clamp(14px,2.6cqi,30px) clamp(18px,3.4cqi,38px)}
.deid-row{display:grid;grid-template-columns:minmax(0,.42fr) minmax(0,1fr);gap:12px clamp(16px,3cqi,32px);align-items:start}
.deid-row + .deid-row{padding-top:clamp(22px,4cqi,40px);border-top:1px dashed var(--line)}
.deid-l h3{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.03em;color:var(--text)}
.deid-l p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.di{position:relative;margin:0;container-type:inline-size;min-width:0;max-width:600px;cursor:pointer}
.di-tabs{display:flex;justify-content:space-between;gap:8px;margin-bottom:2.6cqi}
.di-tabs span{display:inline-flex;align-items:center;height:7.8cqi;padding:0 1.6cqi;font-family:var(--f-mono);font-size:2.86cqi;text-transform:uppercase;color:#b3b3b3;border:1px solid #cdcdcd}
.codebox{border:1px solid #cdcdcd;padding:7.5cqi 7.3cqi 7.5cqi 7.3cqi;font-family:var(--f-mono);font-size:2.86cqi;color:#b3b3b3;overflow:hidden}
.codebox ol{list-style:none;margin:0;padding:0;counter-reset:ln}
.codebox li{position:relative;counter-increment:ln;white-space:pre;height:5.71cqi;line-height:5.71cqi}
.codebox li::before{content:counter(ln);display:inline-block;width:4.15cqi;margin-right:2.6cqi;text-align:right}
.tok,.strip{position:absolute;left:calc(6.75cqi + var(--col) * 1ch);width:calc(var(--w) * 1ch);top:50%;height:5.65cqi;transform:translateY(-50%);display:flex;align-items:center;justify-content:center}
.tok{box-shadow:inset 0 0 0 1px #b6b6b6;background:var(--t-weave) 0 0/25.5cqi,var(--b-grad);background-blend-mode:soft-light,normal;color:#e1e1e1;white-space:nowrap}
.tok b{font-weight:500;font-size:.806em;letter-spacing:.09em;text-transform:uppercase}
.tok.teal{background:var(--t-weave) 0 0/25.5cqi,linear-gradient(180deg,#0e9692 27%,#1a99aa 144%);background-blend-mode:soft-light,normal}
.strip{background:var(--t-noise) 0 0/201.7cqi 8.47cqi no-repeat,var(--c);background-blend-mode:soft-light,normal}
.di.playing .tok,.di.playing .strip{animation:wipe-in 520ms var(--ease-snap) both;animation-delay:calc(450ms + var(--i) * 130ms)}
.mail{position:relative;aspect-ratio:413/347;background:var(--b-grad);color:#a8bbd0;overflow:hidden;isolation:isolate}
.mail::before{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:30cqi;mix-blend-mode:multiply;opacity:.6;pointer-events:none}
.mail-frame{position:absolute;left:4.1%;right:4.1%;top:2.6%;bottom:2.6%;border:1px dashed rgba(255,255,255,.5);overflow:hidden}
.mail-doc{position:absolute;left:5.1%;right:5.1%;top:50%;transform:translateY(-50%);font-size:2.98cqi;line-height:1.32}
.mail-doc.red{color:transparent}
.mail-hd{display:grid;grid-template-columns:13.8cqi auto;gap:1.22cqi 2.44cqi;margin-bottom:5.2cqi;font-family:var(--f-mono);font-size:2.44cqi;line-height:1.3;text-transform:uppercase;justify-items:start}
.mail-doc p{margin:0 0 3.73cqi}
.mail-doc p:last-child{margin:0}
.id{font-weight:500;display:inline-block;line-height:1.04;vertical-align:baseline}
.mail-doc.raw .id{color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.mail-doc.red .id{background:var(--t-redact) 0 0/81cqi 61cqi;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mail.playing .mail-doc.red .id{animation:wipe-in 420ms var(--ease-snap) both;animation-delay:calc(450ms + var(--i) * 90ms)}

/* ---------- design files, email templates, signature ---------- */
[hidden]{display:none!important}
.dl .card.soon{border-style:dashed;background:transparent}
.dl .card.soon h3{color:var(--muted)}
.soon-tag{align-self:flex-start;font-family:var(--f-mono);font-size:10px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-2);padding:6px 9px}
.mailbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:0 0 12px}
.mailbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.mailbar .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mailstage{background:var(--stage);border:1px dashed var(--line);padding:clamp(12px,2.6vw,32px);overflow-x:auto}
.mail-host{display:block;margin:0 auto;max-width:620px}
.mail-host.sig{width:max-content;max-width:100%}
.mailnote{font-size:13px;line-height:1.45;color:var(--muted);margin:10px 0 0;max-width:78ch}
.mailnote code{font-family:var(--f-mono);font-size:11.5px;color:var(--text)}
.sig-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:16px 0}
.field{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.field.full{grid-column:1 / -1}
.field label,.field .flabel{font-size:13px;color:var(--muted)}
.field input:not([type=file]){align-self:stretch;height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:0;background:var(--frame);color:var(--text);font-family:var(--f-body);font-size:15px;letter-spacing:-.02em;transition:border-color 150ms var(--ease-snap)}
.field input:focus{outline:none;border-color:var(--text)}
.field input::placeholder{color:var(--label)}
.field .mailnote{margin:0}
@media (max-width:640px){.sig-form{grid-template-columns:minmax(0,1fr)}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--text);color:var(--bg);padding:10px 14px;font-family:var(--f-mono);font-size:12px;pointer-events:none;transition:opacity 150ms var(--ease-snap),transform 200ms var(--ease-snap);z-index:70;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{width:14px;height:14px;border:1px solid rgba(128,128,128,.5);flex:none}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .gp-grid,.ov,.toc{grid-template-columns:minmax(0,1fr)}
  .gp-copy p{max-width:62ch}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;justify-content:space-between;padding:12px 18px;background-color:var(--bg);background-image:var(--grain);background-size:259px 259px;background-blend-mode:var(--grain-blend);border-bottom:1px dashed var(--line)}
  .topbar .brandmark{width:92px}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:40;transform:translateX(-102%);transition:transform 300ms var(--ease-snap);background-color:var(--bg);background-image:var(--grain);background-size:259px 259px;background-blend-mode:var(--grain-blend)}
  body.nav-open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}
  body.nav-open .scrim{display:block}
  .meta{grid-template-columns:auto 1fr}
  .meta span:nth-child(2){display:none}
}
@media (max-width:640px){
  .pal-top{grid-template-columns:minmax(0,1fr)}
  .pal-row.n4{--n:2!important}
  .surf-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .uses,.pr-two,.dv,.deid-row{grid-template-columns:minmax(0,1fr)}
  .dv .dv-b{margin-top:0}
  .illo-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .illo-l{grid-column:1 / -1}
  .wts{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:10px}
  .ts-spec{flex-direction:column;gap:6px}
  .prompts li{grid-template-columns:minmax(0,1fr)}
  .prompts .n{display:none}
}
</style>

const COPY={"1.1": ["Overview This brand book defines the foundations of Replay’s visual identity and how they come together across different applications.", "It covers the core elements of the system, including logo, colour, typography, graphic language, and examples of the brand in use, with guidance for applying them consistently and with intent.", "The aim is to create a clear and recognisable visual language for Replay while allowing enough flexibility for the brand to adapt across different contexts, formats, and touchpoints."], "2.1": ["Logotype Replay’s logotype pairs a classical serif wordmark with a distinctive graphic mark. The contrast between the two gives the identity an institutional character while keeping it contemporary and ownable.", "The wordmark is intentionally restrained, drawing on the visual language of established financial and information institutions. Its proportions and details are designed to feel precise, enduring, and credible across both digital and physical applications.", "The mark and wordmark form the primary Replay signature and should be used together wherever space allows."], "2.2": ["Mark The Replay mark is built from a series of parallel forms passing through a fixed frame. It reflects the movement of information from what already exists into something structured, usable, and valuable.", "The repeated forms create a sense of continuity and return, while the frame gives the mark the permanence and authority of an institutional seal.", "The mark may be used independently in constrained spaces or where the Replay identity has already been established. For primary brand applications, the full logotype should be preferred."], "2.3": ["Logo Construction The Replay signature is built around a fixed relationship between the mark and wordmark. Their scale, alignment, and spacing have been carefully defined to create a balanced and consistent composition.", "The height of the mark establishes the primary unit of measurement, shown here as X. This unit determines the relationship between the elements and should remain consistent at every scale.", "The proportions of the signature are fixed. Do not independently resize, reposition, or alter the relationship between the mark and wordmark."], "2.4": ["Clearspace Clearspace protects the Replay identity from competing visual elements and ensures it remains distinct in every application.", "The minimum clearspace is derived from the proportions of the mark. X represents the width of the mark, with a minimum exclusion zone of X/4 maintained on all sides.", "No typography, imagery, graphic elements, or page edges should enter this area.", "The same principle applies when the mark is used independently."], "2.5": ["Scalability The Replay signature is designed to remain recognizable across a wide range of sizes, from large-format applications to compact digital environments.", "As the logo is reduced, always preserve its original proportions and allow sufficient contrast for the finer details of the mark and wordmark to remain clear.", "The minimum recommended size for the full signature is 24 px in height for digital applications. Below this size, use the standalone mark where appropriate."], "2.6": ["Incorrect usage The Replay identity should always be reproduced from approved master artwork. Its proportions, composition, and appearance must remain consistent across every application.", "Do not alter the colour of individual elements, change the relationship between the mark and wordmark, add text to the signature, reposition or reorder its elements, distort its proportions, apply effects, or recreate the logo using alternate typography.", "Always maintain sufficient contrast between the logo and its background, and follow the approved colour combinations defined in these guidelines."], "3.1": ["Brand Palette A restrained palette built for clarity and recognition. Warm neutrals form the foundation of the identity, while Replay Blue creates a distinct point of recognition. Supporting colours add range when needed, with softer tones reserved primarily for artwork and illustration."], "3.2": ["Neutrals & Surfaces Paper, Mist, Ink, and Night form Replay’s primary surfaces across light and dark applications. Use supporting neutrals sparingly for secondary information and structure."], "3.3": ["Colour in Use Colour creates hierarchy rather than decoration. Most compositions should begin with a neutral surface, using Replay Blue or a supporting accent to establish focus. Stronger colours should remain intentional, while softer combinations are best reserved for expressive artwork."], "3.4": ["Usage Principles Keep the palette restrained and purposeful. Let neutrals carry most compositions, use Replay Blue for recognition and emphasis, and limit the number of accents used at once. Avoid introducing near-matches to the core palette or using colour where typography, spacing or hierarchy can do the work."], "4.1": ["Primary Typeface STK Bureau Serif Book is Replay’s primary display typeface, used for headlines and key brand moments. Its serif structure gives the brand a more editorial and distinctive voice, helping important messages feel considered and recognisable. Use it at larger sizes where its character and proportions can come through clearly, and avoid using it for dense or functional text."], "4.2": ["Secondary Typeface Geist is Replay’s secondary typeface and the default for body copy and UI. Geist Mono is used for technical labels, metadata, and small uppercase text. Both are available through Google Fonts."], "4.3": ["Type-setting STK Bureau Serif is used for headlines, Geist for body copy and UI, and Geist Mono for small uppercase labels. Use regular weights throughout and avoid bold. Tracking becomes tighter as type increases in size. Follow the specifications below for size, leading, and tracking."], "4.4": ["Primary typeface Fallback fonts Use STK Bureau Serif Book wherever possible. When it is unavailable, such as in presentations or external tools, use the approved fallback typefaces shown here. Fallbacks should not replace the primary typeface in standard brand applications."], "4.5": ["Secondary typeface Fallback fonts Use Geist wherever possible. When it is unavailable, such as in presentations or external tools, use the approved fallback typefaces shown here. Fallbacks should not replace Geist in standard brand applications."], "5.1": ["Illustrations Replay illustrations make complex systems easier to understand. They should feel technical, precise, and intentionally constructed rather than decorative.", "Isometric visualisation Use controlled isometric compositions to explain systems, infrastructure, and data relationships. Keep forms geometric, technical, and restrained.", "2D technical visualisation Use flat, diagrammatic compositions for clearer, more direct explanations. Combine interfaces, data, grids, and structured forms with minimal decoration."], "5.2": ["Data Visualisation Data visualisation should make information easier to understand. Use simple charts, diagrams, and structured data forms with clear hierarchy and a single visual focus. Use Replay colours selectively to distinguish important information. Avoid unnecessary labels or decorative effects."], "5.3": ["Background Use fibre texture to bring subtle depth and tactility to large colour and neutral fields without distracting from the content. Guilloché patterns can be used sparingly as a secondary graphic detail, adding structure and visual interest where needed without becoming the dominant element."], "5.4": ["De-identification De-identification visuals should clearly show the transition from raw data to de-identified data. Remove or abstract identifiable details while preserving the underlying structure and context. Avoid visuals that suggest the data is simply blurred, hidden, or deleted."]};

400\n    lineHeight: 1.4\n    letterSpacing: -0.03em\n  label-md:\n    fontFamily: Geist Mono\n    fontSize: 12px\n    fontWeight: 400\n    lineHeight: 1.33\n    letterSpacing: 0.025em\n  label-sm:\n    fontFamily: Geist Mono\n    fontSize: 10px\n    fontWeight: 400\n    lineHeight: 1.5\n    letterSpacing: 0.08em\n  cta:\n    fontFamily: STK Bureau Serif\n    fontSize: 16px\n    fontWeight: 400\n    lineHeight: 0.8\n    letterSpacing: 0.01em\nrounded:\n  none: 0px\n  full: 9999px\nspacing:\n  unit: 4px\n  xs: 4px\n  sm: 8px\n  md: 16px\n  base: 24px\n  lg: 40px\n  xl: 64px\n  2xl: 80px\n  3xl: 176px\n  margin-mobile: 24px\n  margin-desktop: 72px\n  container-max: 1560px\n  measure: 560px\n  measure-hero: 669px\n  nav-height: 64px\n  field-height: 48px\ncomponents:\n  button-primary:\n    backgroundColor: \"{colors.primary}\"\n    textColor: \"{colors.on-primary}\"\n    typography: \"{typography.cta}\"\n    rounded: \"{rounded.none}\"\n    padding: 20px\n  button-primary-hover:\n    backgroundColor: \"{colors.secondary}\"\n    textColor: \"{colors.on-primary}\"\n  button-primary-pressed:\n    backgroundColor: \"{colors.primary}\"\n    textColor: \"{colors.on-primary}\"\n  button-secondary:\n    backgroundColor: \"{colors.surface}\"\n    textColor: \"{colors.on-surface}\"\n    typography: \"{typography.body-sm}\"\n    rounded: \"{rounded.none}\"\n    padding: 12px\n  nav-link:\n    backgroundColor: \"{colors.surface}\"\n    textColor: \"{colors.on-surface-body}\"\n    typography: \"{typography.body-sm}\"\n  nav-link-hover:\n    backgroundColor: \"{colors.surface}\"\n    textColor: \"{colors.on-surface}\"\n  footer-link:\n    backgroundColor: \"{colors.surface-night}\"\n    textColor: \"{colors.on-dark-muted}\"\n    typography: \"{typography.label-md}\"\n  footer-link-hover:\n    backgroundColor: \"{colors.surface-night}\"\n    textColor: \"{colors.on-primary}\"\n  section-tag:\n    backgroundColor: \"{colors.surface}\"\n    textColor: \"{colors.on-surface-body}\"\n    typography: \"{typography.label-sm}\"\n    rounded: \"{rounded.none}\"\n    height: 32px\n  section-tag-on-blue:\n    backgroundColor: \"{colors.secondary}\"\n    textColor: \"{colors.on-secondary-muted}\"\n    typography: \"{typography.label-sm}\"\n  input:\n    backgroundColor: \"{colors.surface-card}\"\n    textColor: \"{colors.on-surface}\"\n    typography: \"{typography.body-md}\"\n    rounded: \"{rounded.none}\"\n    height: 48px\n    padding: 20px\n  input-label:\n    backgroundColor: \"{colors.surface-card}\"\n    textColor: \"{colors.on-surface-body}\"\n    typography: \"{typography.body-sm}\"\n  input-error-message:\n    backgroundColor: \"{colors.surface-card}\"\n    textColor: \"{colors.error}\"\n    typography: \"{typography.body-sm}\"\n  card-grain:\n    backgroundColor: \"{colors.surface-mist}\"\n    textColor: \"{colors.on-surface}\"\n    rounded: \"{rounded.none}\"\n    padding: 20px\n    height: 240px\n  card-grain-hover:\n    backgroundColor: \"{colors.secondary}\"\n    textColor: \"{colors.on-primary}\"\n  panel-mist:\n    backgroundColor: \"{colors.surface-mist}\"\n    textColor: \"{colors.on-surface-reading}\"\n  panel-night:\n    backgroundColor: \"{colors.surface-night}\"\n    textColor: \"{colors.on-primary}\"\n  panel-night-label:\n    backgroundColor: \"{colors.surface-night}\"\n    textColor: \"{colors.on-surface-label}\"\n    typography: \"{typography.label-md}\"\n  panel-blue:\n    backgroundColor: \"{colors.secondary}\"\n    textColor: \"{colors.on-primary}\"\n  tab:\n    backgroundColor: \"{colors.surface}\"\n    textColor: \"{colors.on-surface}\"\n    typography: \"{typography.cta}\"\n    rounded: \"{rounded.none}\"\n  tab-selected:\n    backgroundColor: \"{colors.primary}\"\n    textColor: \"{colors.on-primary}\"\n  tooltip:\n    backgroundColor: \"{colors.primary}\"\n    textColor: \"{colors.on-primary}\"\n    typography: \"{typography.label-md}\"\n    rounded: \"{rounded.none}\"\n    padding: 8px\n  status-dot-idle:\n    backgroundColor: \"{colors.on-surface-label}\"\n    rounded: \"{rounded.full}\"\n    size: 5px\n  status-dot-active:\n    backgroundColor: \"{colors.primary}\"\n    rounded: \"{rounded.full}\"\n    size: 5px\n  status-dot-done:\n    backgroundColor: \"{colors.success}\"\n    rounded: \"{rounded.full}\"\n    size: 5px\n  status-dot-failed:\n    backgroundColor: \"{colors.error}\"\n    rounded: \"{rounded.full}\"\n    size: 5px\n  divider:\n    backgroundColor: \"{colors.line}\"\n    height: 1px\n  frame:\n    backgroundColor: \"{colors.line-strong}\"\n    height: 1px\n  corner-fold:\n    backgroundColor: \"{colors.primary}\"\n    size: 16px\n  corner-fold-hover:\n    backgroundColor: \"{colors.accent-sky}\"\n    size: 16px\n  colour-bar-sky:\n    backgroundColor: \"{colors.accent-sky}\"\n    height: 9px\n  colour-bar-olive:\n    backgroundColor: \"{colors.accent-olive}\"\n    height: 9px\n  colour-bar-gray:\n    backgroundColor: \"{colors.accent-bar-gray}\"\n    height: 9px\n  colour-bar-sun:\n    backgroundColor: \"{colors.accent-sun}\"\n    height: 9px\n  chart-bar-tier-1:\n    backgroundColor: \"{colors.accent-bar-gray}\"\n  chart-bar-tier-2:\n    backgroundColor: \"{colors.accent-teal}\"\n  chart-bar-tier-3:\n    backgroundColor: \"{colors.accent-sky}\"\n  chart-bar-alt:\n    backgroundColor: \"{colors.accent-slate}\"\n  brand-gradient-end:\n    backgroundColor: \"{colors.secondary-bright}\"\n  page:\n    backgroundColor: \"{colors.neutral}\"\n    textColor: \"{colors.on-surface}\"\n---\n\n# Replay\n\nThis file is the agent-facing contract for Replay's visual system. Tokens above are normative. The prose below says how to apply them. `brand.md` holds the full audit, rationale and roadmap; read it when a decision is not covered here.\n\nSources: Figma `UstspKowhUbYUC0zzT5DRc` (Final Pages, Brand Guidelines WIP), Figma `AYzBKhVneW9mct6tUchEo7` (Dev Handoff, Animations), repo `PIXELUPLABS/sunsethq`.\n\n## Overview\n\nReplay should feel like a document an institution has issued: a register, a certificate, an assay report. The page is paper. Everything on it is printed, stamped or filed. Colour is scarce, and the one blue marks the moment value is revealed.\n\nThe audience is founders and executives of operating companies, often cash-constrained, who are sceptical of a new category. The UI must earn trust by being precise, plain and unhurried, and by showing the mechanism (records going through de-identification) rather than claiming it.\n\nPersonality: Premium, Precise, Trustworthy, Editorial, Confident. Serious and Safe. Strongly timeless, muted, authoritative, light-first. Not playful, energetic, experimental or rebellious.\n\nThe one positioning rule that overrides every other: **nothing may read as winding down, closing or shutting down.** No warm tan, no sunset tones, no rounded friendly cards, no farewell language. That is the parent brand, Sunset, and Replay exists to escape its misread.\n\n## Colors\n\nThe palette is neutrals plus one blue. Neutrals carry nearly every composition; colour creates hierarchy, not decoration.\n\n- **Primary / Ink (#141518):** headlines, body headings and the primary button. The site's darkest UI colour.\n- **Secondary / Blue Deep (#133264) to Blue Bright (#147DBA):** Replay Blue. Always used as a top-to-bottom gradient, deep at ~27% and bright at ~144% of the height, with the canvas weave texture soft-lit over it. It appears on the primary button's hover, the growth card's hover and the value panels. One blue surface per viewport.\n- **Neutral / Paper (#FCFCFC):** the page. Grain is always multiplied over it.\n- **Surface card / White (#FFFFFF):** sheets that sit on Paper (forms, shelf tiles).\n- **Surface mist / Mist (#EAEBF1):** feature bands.\n- **Surface night / Night (#080808):** dark sections and the footer.\n- **On-surface body (#727272):** body copy on Paper and White only. It fails contrast on Mist (4.04:1); use Reading gray there.\n- **On-surface reading (#565656):** long copy and any text on Mist.\n- **On-surface label (#898989):** small labels **on Night only** (5.73:1). On Paper it is 3.41:1 and fails AA.\n- **On-dark muted (#9C9C9C):** secondary text on Night (equivalent to white at 60%).\n- **Line (#D4D4D4):** dashed rules and guides, 1px, dash 4 gap 4.\n- **Line strong (#A8A8A8):** frames, field borders, tag boxes.\n- **Error (#BF000F):** errors only.\n- **Success (#54702F):** completed states. Shares Olive's value.\n- **Accents: Sky (#499DF8), Olive (#54702F), Sun (#EAE058), Bar gray (#7E7E7E):** the colour bar only, plus Sky on the hovered corner fold. Never as text on Paper; Sky is 2.74:1 and Sun fails outright.\n- **Chart: Teal (#0E9692), Slate (#3A5979):** data bars only.\n\nArtwork palette, never UI: Butter #F0EDD1, Sage #B7D3C1, Cream #FBF1D0. These colour torn-paper specimens and illustration fills. They are deliberately not tokens. Lavender (#C1B4D8) appears in the Figma file but conflicts with the founder's \"no purple\" brief; do not use it.\n\n## Typography\n\nThree families, one job each. Weight is always 400. Hierarchy comes from size and family, never from bold.\n\n- **STK Bureau Serif (Book):** everything that is *said*. Headlines, card titles, big numbers, CTA labels. Self-hosted. Tracking −4% at display sizes, −1% at card size. Falls back to Newsreader on the web, then Georgia.\n- **Geist:** everything that is *explained*. Body, nav, form fields, descriptions. Tracking −3%. Falls back to Helvetica, then Inter.\n- **Geist Mono:** everything that is *filed*. Eyebrows, labels, footer links, indexes, record headers. Always uppercase, positive tracking (+8% at 10px, +2.5% at 12px).\n\nRules:\n\n- Headlines are sentence case with a full stop. \"Your data stays yours.\"\n- Responsive steps are fixed, not fluid: H1 72 → 56 → 42, H2 44 → 36, body 16 → 14.5.\n- The STK Bureau Regular cut is a 71-glyph trial file. Use it for card titles (H3) only; never for headlines.\n- CTA labels are uppercase with +8% tracking, **except \"Value my data\", which is always sentence case** at +1%.\n- Big numbers ($100K+, 26 days) are serif at headline size with a 14px Body-gray label underneath, never on the same line as mono text.\n\n## Layout\n\nA fixed-max-width column on a full-bleed paper ground.\n\n- Content max width 1560px, centred. The design canvas is 1440 with 72px side margins (a 1296px column).\n- Side margins: 24px below 640px, 72px from 640px up.\n- Base unit 4px. The working gap is **24px**; use it unless there is a reason not to. Section-internal blocks sit 40px apart; major sections 64 / 80 / 176px depending on viewport.\n- Reading measure: 560px for long copy, 669px for hero sublines.\n- Breakpoints: mobile < 640, tablet 640–1023, desktop ≥ 1024. Custom breakpoints are local to an illustration and must be commented.\n- A section is: eyebrow tag → H2 → one paragraph → the working (diagram, index, panel) → optional CTA. Sections are separated by a dashed rule or a surface change, not by empty space alone.\n- Fixed header, 64px tall.\n\n## Elevation & Depth\n\nFlat. Depth comes from surface steps and lines, never from shadow.\n\n- Order of surfaces: Paper (page) → White (sheet) → Mist (band) → Night (dark section) → Blue (reveal).\n- Every flat area wider than a hairline carries texture: grain multiplied over Paper; canvas weave soft-lit over Blue; noise soft-lit over the colour bar.\n- One drop shadow exists, on the Value-my-data form card: `0 8px 28px -10px rgba(20,21,24,0.10)`. If another is ever required, copy it exactly. Otherwise use none.\n- No glassmorphism, glows or blurred backdrops on content. The fixed nav's blur is the only backdrop filter allowed.\n\n## Shapes\n\nSquare, registered, hairline.\n\n- **Radius is 0** on every container, button, input, tag, card and panel. `rounded.full` exists only for 5px status dots.\n- Borders are 1px. Dashed in Line for guides and dividers; solid in Line strong for frames and fields; solid Ink for focus and selected states.\n- Corners carry meaning instead of radius: a **16px corner fold** (black triangle, top-right, turns Sky on hover), **registration ticks** on illustration frames, and a **torn bottom edge** on grain cards from 640px up.\n- Tags are mono text in a bordered 32px box; an optional icon sits in an adjacent 32px square that shares the border.\n\n## Components\n\n- **Primary button.** Ink rectangle, white serif label. Hover (pointer devices only): the brand gradient and canvas weave fade in over 300ms and two 6px colour strips slide in from the left and right edges. Press: `scale(0.98)`, 150ms. Touch: the hover stack reveals on press. One primary button per viewport; never inside a card.\n- **Secondary button.** Paper fill, 1px Ink border, Geist 12–14px. Same press feedback.\n- **Nav link.** Geist 14px, Body gray → Ink on hover, 150ms colour only.\n- **Footer link.** Geist Mono uppercase on Night, muted white → white; a 1px underline grows from 0 to full width on hover.\n- **Section tag.** See Shapes. Light: Line-strong border, Body-gray text. On blue: #A9B8C8 border and text.\n- **Input / select.** 48px tall, White ground, 1px Line border, 20px horizontal padding, 15–16px Geist. Focus: border becomes Ink, no ring. Label above in 14px Body gray, 8px gap. Error: border Error red, message 12–14px Error red beneath, 4px gap. Selects use a 16px chevron inset 16px.\n- **Grain card.** 240px tall, 20px padding, grey grain ground, corner fold, torn edge. Optional hover floods the brand gradient; text turns white, fold turns Sky.\n- **Panels.** Mist (Reading-gray text), Night (white text, colour bar at the foot), Blue (white text, gradient + weave).\n- **Tabs.** Equal-width bordered cells with serif labels. The selected state is an Ink fill that slides between cells. Auto-advancing tabs show progress as a thin strip filled by `clip-path`, and stop advancing once the user picks a tab.\n- **Disclosure / FAQ.** Numbered `01`, dashed rules between items, a `+` that rotates into `−`, height animated with `grid-template-rows` 0fr → 1fr over 200ms.\n- **Status.** A 5px dot plus a mono label. Idle (Label gray, on Night) / active (Ink) / done (Olive) / failed (Error).\n- **Numbers.** Serif value at 56–72px over a 14px Body-gray label. Counts up from zero once on entering view.\n- **Data visualisation.** Bars only, in Bar gray / Teal / Sky, noise multiplied. No pies, no area fills.\n- **Tooltip / popover (not yet built).** Ink ground, white mono 12px, no radius; enter at `scale(0.97)` + fade from the trigger's origin, 150ms.\n\n## Motion\n\nTwo tempos: fast ink, slow ceremony. Nothing springs, bounces or overshoots.\n\n| Token | Value | Use |\n|---|---|---|\n| duration-instant | 100ms | Exits of small popovers, tooltips |\n| duration-fast | 150ms | Press, hover colour, input border |\n| duration-base | 200ms | Disclosures, tab crossfade, popover enter |\n| duration-slow | 300ms | Primary button hover stack, mobile nav enter |\n| duration-reveal | 500ms | Scroll-in reveals, count-up |\n| ease-snap | cubic-bezier(0.23, 1, 0.32, 1) | Every enter, hover and press |\n| ease-swift | cubic-bezier(0.77, 0, 0.175, 1) | Movement between two on-screen positions |\n| ease-drawer | cubic-bezier(0.32, 0.72, 0, 1) | Sheets and drawers |\n| scale-press | 0.98 | Every pressable |\n| distance-sm | 8px | Reveal rise, menu slide |\n\n- Animate `transform` and `opacity` only in anything a user can trigger repeatedly. Name the properties; never `transition: all`.\n- Exits are faster than enters.\n- Gate hover effects behind `(hover: hover) and (pointer: fine)`.\n- Scroll-triggered animation plays when 30% of the element is visible, pauses when it fully leaves, restarts on re-entry. Never scroll-hijack.\n- Ceremonies (the de-identification pass, the footer wordmark sweep, count-ups) may run 500–900ms or longer because they explain something. They play once per viewing.\n- Under `prefers-reduced-motion`, keep opacity and colour changes; drop movement.\n- Nothing animates on a keyboard-initiated action.\n\n## Imagery & Texture\n\nThe assets live in this kit under `textures/` and `patterns/`.\n\n- **Show the working.** Imagery is real operating material (Slack threads, emails, tickets, commits, dashboards) passing through a visible mechanism (scan line, redaction bars, placeholder tokens like `[user_01]`, stacked isometric slabs with pinned callouts).\n- Specimens are cut out with torn edges, never drop-shadowed, and are cropped by the frame.\n- Never personal or sensitive records (payroll, medical bills). Labels must match what the block shows.\n- No stock photography, abstract gradient blobs, glowing orbs or neural-network art.\n- The **colour bar** is a fixed six-segment strip (Sky, Olive, Bar gray, Sun, Sky, Olive) with noise, 8–9px high under the nav and heroes, up to 20px under the home pipeline line. It is never a background and never a chart.\n- The **record header** texture (`CLASSIFICATION PROPRIETARY DATA / LICENSING`, `RL-2026-001 // Version 1.0`) is set in 6–8px mono at low contrast. It is texture, not copy.\n\n## Voice\n\nPlain, declarative, specific. Second person; present tense; short sentences.\n\n- Verb-first CTAs. The brand CTA is \"Value my data\".\n- Words to use: license (never sell), de-identify (never anonymise), operating data, frontier AI labs, named buyers, valuation, revenue share.\n- Never: unlock, leverage, seamless, cutting-edge, powerful, empower, journey, wind down, shut down. No exclamation marks, no em dashes, no emoji.\n- Every figure in placeholder or benchmark copy is unconfirmed until the client signs it off. Bracket it.\n\n## Do's and Don'ts\n\n- Do start every composition on Paper with grain; add Mist, Night or Blue only to create hierarchy.\n- Do use the brand blue as a gradient with weave, on one surface per viewport.\n- Do use Reading gray, never Body gray, for any text on Mist.\n- Do keep Label gray for Night. On light surfaces, labels use Body gray.\n- Do give every pressable a 0.98 press scale and a visible `:focus-visible` outline (2px Ink, 2px offset, white on dark surfaces).\n- Don't add a border radius to anything except a 5px status dot.\n- Don't use bold. Change size or family instead.\n- Don't use Sky, Sun or Blue Bright as text on Paper; all fail contrast.\n- Don't use a drop shadow, glow, glass panel or second blue.\n- Don't use purple, warm tan or sunset tones.\n- Don't place two primary buttons in one viewport.\n- Don't animate layout properties, add springs, or exceed 300ms on any UI interaction.\n- Don't redraw the logo. Use the files in `logo/`; keep X/4 clear space and a 24px minimum.\n";

const aiBrief=()=>`# Replay brand brief

Replay licenses de-identified operating data from companies that are still running to frontier AI labs. The identity reads as an institution that issues and certifies an asset: paper, ink, hairlines, one blue, no radius.

The rule that overrides every other: nothing may read as winding down, closing or shutting down. No sunset or warm tan tones, no farewell language.

Personality: premium, precise, trustworthy, editorial, confident. Serious and calm, never playful.

## Voice
- Plain, declarative, specific. Second person, present tense, short sentences.
- Headlines are sentence case with a full stop: "Your data stays yours."
- Verb-first calls to action. The brand CTA is "Value my data".
- Say license (never sell), de-identify (never anonymise), operating data, frontier AI labs, named buyers, valuation, revenue share.
- Never say unlock, leverage, seamless, cutting-edge, powerful, empower, journey, wind down or shut down. No exclamation marks, em dashes or emoji.
- Put any unconfirmed figure in brackets: [$100K+].

## Logo
- The primary signature is the mark plus the serif wordmark, used together wherever space allows. The mark alone is for constrained spaces or where Replay is already established.
- The height of the mark is the unit X. Clearspace is X/4 on all sides, where X is the width of the mark. Minimum size is 24 px tall on screen; below that, use the mark.
- Ink on Paper is primary; White on Night or on Brand blue is the reversed version.
- Never recolour individual elements, change the mark/wordmark relationship, add text, reorder, distort, apply effects, rebuild in other type, or place on low-contrast backgrounds.

## Colour
${COLOURS.map(g=>`- ${g.g}: `+g.items.map(([n,h,r])=>`${n} ${h} (${r.toLowerCase()})`).join(", ")).join("\n")}
- Neutrals carry most compositions. Start on Paper; add Mist, Night or Blue only to create hierarchy.
- Brand blue is a gradient, ${GRADIENT}, always with the weave texture in soft-light. One blue surface per viewport, never a second blue.
- Body gray is for Paper and White only; use Reading gray on Mist and Label gray on Night only.
- Sky, Sun and Blue Bright never set text on Paper. Accents live in the colour bar; Teal and Slate are for chart bars.
- No purple, warm tan or sunset tones.

## Typography
- STK Bureau Serif Book for everything that is said: headlines, card titles, big numbers, CTA labels. Not for dense or functional text.
- Geist for everything that is explained: body, navigation, forms. Geist Mono, always uppercase, for everything that is filed: eyebrows, labels, indexes.
- Weight 400 throughout; hierarchy comes from size and family, never bold. Tracking tightens as size increases.
- CTA labels are uppercase with +8% tracking, except "Value my data", which is always sentence case.
- Fallbacks: Georgia then Times New Roman for STK Bureau; Helvetica then Inter for Geist.
${LADDER.map(r=>`- ${r[1]}: ${r[2]}${r[6]?" uppercase":""}, ${r[3]}px, leading ${r[4]}, tracking ${r[5]}`).join("\n")}

## Layout and shape
- Radius is 0 on everything except 5px status dots. Borders are 1px: dashed Line (#D4D4D4) for guides and dividers, solid Strong line (#A8A8A8) for frames and fields.
- Flat: depth comes from surface steps and lines, never shadows, glows or glass.
- Every flat area carries texture: grain multiplied over Paper, weave soft-lit over Blue, noise soft-lit over the colour bar.
- Content max width 1560px; working gap 24px; reading measure 560px.
- A section runs: mono eyebrow tag, serif H2, one paragraph, the working (diagram, index, panel), optional CTA.

## Components
- Primary button: Ink rectangle with a white serif label. On hover the brand gradient and weave fade in over 300ms and two 6px colour strips slide in from the edges. Press scales to 0.98. One per viewport, never inside a card.
- Secondary button: Paper fill, 1px Ink border, Geist 12 to 14px.
- Section tag: mono 10px uppercase in a bordered box.
- Corner fold: a 16px Ink triangle at the top right of cards that turns Sky on hover.

## Motion
- Two tempos: fast ink (150 to 300ms) for feedback, slow ceremony (500 to 900ms) for explanations such as the de-identification pass.
- Ease cubic-bezier(0.23, 1, 0.32, 1) for every enter, hover and press. Nothing springs, bounces or overshoots.
- Animate transform and opacity only. Respect reduced motion: keep opacity and colour changes, drop movement.

## Graphic system
- Show the working: real operating records (Slack threads, emails, tickets, commits) passing through a visible mechanism (scan line, redaction bars, placeholder tokens, isometric slabs).
- Illustration: technical, precise, constructed. Controlled isometric compositions for systems; flat 2D diagrams for direct explanations.
- Data visualisation: bars only, in Bar gray, Teal and Sky, one visual focus, no decorative effects.
- Backgrounds: fibre texture on large colour and neutral fields; guilloché sparingly as a secondary detail.
- De-identification: show raw to de-identified with labelled placeholders such as [user id_0291], colour-bar strips or guilloché bars. Never show data as simply blurred, hidden or deleted.
- No stock photography, gradient blobs, glowing orbs or neural-network art.
`;

async function copyRich(html,plain,done){
  let ok=false;
  try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([plain],{type:"text/plain"})})]);ok=true}}catch(e){}
  if(!ok){const box=document.createElement("div");box.setAttribute("contenteditable","true");box.style.cssText="position:fixed;left:-10000px;top:0;opacity:0";box.innerHTML=html;document.body.appendChild(box);
    const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);try{ok=document.execCommand("copy")}catch(e){}sel.removeAllRanges();box.remove()}
  toast(ok?done:"Copy failed. Download the .html file instead.")}
