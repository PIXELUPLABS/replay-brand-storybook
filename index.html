async function zipTextures(z){for(const [id,label,file,url] of TEXTURES)z.file(file,await fetchBlob(url))}
async function zipFonts(z){for(const [file,url] of FONT_FILES)z.file(file,await fetchBlob(url))}
async function zipAI(z){z.file("replay-brand-brief.md",aiBrief());z.file("DESIGN.md",DESIGN_MD);z.file("brand.md",await fetchBlob("assets/brand/brand.md"));z.file("replay-repo-setup.md",REPO_SETUP)}
async function zipMockups(z){for(const [id] of MOCKUPS)z.file(`replay-${id}.png`,await fetchBlob(`assets/mockups/replay-${id}.png`))}
async function download(kind,btn){
  if(kind==="brief")return saveFile("replay-brand-brief.md",aiBrief());
  if(kind==="brandmd"){try{return saveFile("brand.md",await fetchBlob("assets/brand/brand.md"))}catch(e){toast("Couldn't load brand.md. Try again.");return}}
  if(typeof JSZip==="undefined"){toast("The zip library didn't load. Reload the page and try again.");return}
  const old=btn?btn.innerHTML:"";if(btn){btn.disabled=true;btn.textContent="Preparing…"}
  try{const z=new JSZip(),k=kind==="kit";
    if(kind==="logos"||k)await zipLogos(k?z.folder("logos"):z);
    if(kind==="favicons"||k)await zipFavicons(k?z.folder("favicons"):z);
    if(kind==="fonts"||k)await zipFonts(k?z.folder("fonts"):z);
    if(kind==="textures"||k)await zipTextures(k?z.folder("textures"):z);
    if(kind==="tokens"||k){const t=k?z.folder("tokens"):z;t.file("replay-tokens.css",tokensCSS());t.file("replay-tokens.json",tokensJSON())}
    if(kind==="ai"||k)await zipAI(k?z.folder("ai"):z);
    if(kind==="emails"||k)await zipEmails(k?z.folder("emails"):z);
    if(kind==="mockups")await zipMockups(z);
    const names={kit:"replay-brand-assets.zip",ai:"replay-ai-files.zip",emails:"replay-email-templates.zip"};
    await saveFile(names[kind]||`replay-${kind}.zip`,await z.generateAsync({type:"blob"}));
  }catch(e){toast("Couldn't build the download. Try again.")}
  finally{if(btn){btn.disabled=false;btn.innerHTML=old}}
}

/* ---------- lightbox ---------- */
let lbIdx=-1,lbReturn=null;
function lbRender(){const lb=$("#lb");if(!lb)return;const[id,name,w,h]=MOCKUPS[lbIdx];
  $(".lb-top",lb).innerHTML=`<span><b>${esc(name)}</b>&nbsp;&nbsp;${w} × ${h} px</span><span>${String(lbIdx+1).padStart(2,"0")} / ${MOCKUPS.length}</span>`;
  const img=$(".lb-stage img",lb);img.src=`assets/mockups/preview/${id}.webp`;img.alt=`${name} mockup`;}
function lbOpen(i){lbIdx=i;lbReturn=document.activeElement;
  document.body.insertAdjacentHTML("beforeend",`<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Mockup viewer"><div class="lb-top"></div><div class="lb-stage"><img alt=""></div><div class="lb-bot"><div class="btnrow"><button class="btn" data-lb-step="-1">${ICON.back}Previous</button><button class="btn" data-lb-step="1">Next${ICON.arr}</button></div><div class="btnrow"><button class="btn" data-lb-dl>${ICON.dl}Download PNG</button><button class="btn" data-lb-close>${ICON.x}Close</button></div></div></div>`);
  lbRender();const lbEl=$("#lb");void lbEl.offsetWidth;lbEl.classList.add("on");$("[data-lb-close]").focus();document.body.style.overflow="hidden";}
function lbClose(){const lb=$("#lb");if(!lb)return;lb.classList.remove("on");setTimeout(()=>lb.remove(),150);document.body.style.overflow="";lbIdx=-1;if(lbReturn)lbReturn.focus()}
async function saveMock(i){const[id,name]=MOCKUPS[i];try{await saveFile(`replay-${id}.png`,await fetchBlob(`assets/mockups/replay-${id}.png`))}catch(e){toast(`Couldn't load the ${name} PNG. Try again.`)}}
document.addEventListener("keydown",e=>{
  if(lbIdx>=0){if(e.key==="Escape")lbClose();else if(e.key==="ArrowRight"){lbIdx=(lbIdx+1)%MOCKUPS.length;lbRender()}else if(e.key==="ArrowLeft"){lbIdx=(lbIdx-1+MOCKUPS.length)%MOCKUPS.length;lbRender()}return}
  const etab=e.target.closest&&e.target.closest("[data-em-tab]");
  if(etab&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){setEmTab((emTab+(e.key==="ArrowRight"?1:-1)+EMAILS.length)%EMAILS.length,true);return}
  const tab=e.target.closest&&e.target.closest("[data-ai-tab]");
  if(tab&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const n=(aiTab+(e.key==="ArrowRight"?1:-1)+AI_TABS.length)%AI_TABS.length;setAiTab(n,true)}
});

/* ---------- motion: replay on hover (pointer) or tap (touch) ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)"), fine=matchMedia("(hover: hover) and (pointer: fine)");
function replay(host){if(reduce.matches)return;const el=host.querySelector(".ch-a,.ch-b,.mail")||host;el.classList.remove("playing");void el.offsetWidth;el.classList.add("playing")}
function bindMotion(root){
  $$("[data-play]",root).forEach(h=>{h.addEventListener("mouseenter",()=>{if(fine.matches)replay(h)});h.addEventListener("click",()=>{if(!fine.matches)replay(h)})});
  $$("[data-video]",root).forEach(f=>{const v=$("video",f);
    const play=()=>{if(reduce.matches)return;f.classList.add("on");try{v.currentTime=0}catch(e){}const p=v.play();if(p&&p.catch)p.catch(()=>f.classList.remove("on"))};
    const stop=()=>{f.classList.remove("on");v.pause()};
    f.addEventListener("mouseenter",()=>{if(fine.matches)play()});f.addEventListener("mouseleave",()=>{if(fine.matches)stop()});
    f.addEventListener("click",()=>{if(fine.matches)return;f.classList.contains("on")?stop():play()});
    v.addEventListener("ended",()=>{if(!f.matches(":hover"))stop()});});
}

/* ---------- router and events ---------- */
function setAiTab(i,focus){aiTab=i;const t=$("#ai-tabs");if(!t)return;t.style.setProperty("--k",i);
  $$("[data-ai-tab]",t).forEach((b,k)=>{b.setAttribute("aria-selected",k===i);b.tabIndex=k===i?0:-1});
  $("#ai-panel").innerHTML=aiPanel();decorate($("#ai-panel"));if(focus)$$("[data-ai-tab]",t)[i].focus()}
function buildNav(cur){
  $("#nav").innerHTML=CH.map(c=>`<li class="${c.id===cur?"on":""}"><a class="top" href="#/${c.id==="home"?"":c.id}"><span>${c.n.replace(".0","")}</span>${esc(c.t)}</a><ul>${c.pages.map(([n,t])=>`<li><a href="#/${c.id}/${n}" data-sub-link="${n}"><i>${n}</i>${esc(c.id==="in-action"?"Mockups":t)}</a></li>`).join("")}</ul></li>`).join("");
}
let spy;
function route(){
  const [,cid="",sub=""]=(location.hash||"#/").split("/");
  const ch=CH.find(c=>c.id===(cid||"home"))||CH[0];
  $("#page").innerHTML=renderChapter(ch);
  buildNav(ch.id);decorate($("#page"));bindMotion($("#page"));renderEmailPreview();renderSigPreview();checkHosts();
  document.title=(ch.id!=="home"?ch.t+" — ":"")+"Replay Brand Guidelines";
  document.body.classList.remove("nav-open");$("#menu-btn").setAttribute("aria-expanded","false");
  if(sub){const t=document.getElementById("p-"+sub);if(t)t.scrollIntoView()}else window.scrollTo(0,0);
  if(spy)spy.disconnect();
  spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$("[data-sub-link]").forEach(a=>a.classList.toggle("cur",a.dataset.subLink===e.target.dataset.sub))}),{rootMargin:"-30% 0px -60% 0px"});
  $$("[data-sub]").forEach(s=>spy.observe(s));
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.emTab!==undefined){setEmTab(+t.dataset.emTab);return}
  if(t.dataset.emMode){emMode=t.dataset.emMode;$$("[data-em-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.emMode===emMode));renderEmailPreview();return}
  if(t.dataset.emCopy){const{t:tp,o}=emailOut();if(t.dataset.emCopy==="html")copyText(emailDoc(tp,o),`${tp.label} HTML`);else{const card=emailCard(tp,o);copyRich(card,plainOf(card),"Copied the email. Paste it into a message.")}return}
  if(t.hasAttribute("data-em-dl")){const{t:tp,o}=emailOut();saveFile(`replay-email-${tp.id}${emMode==="tags"?"":"-sample"}.html`,emailDoc(tp,o));return}
  if(t.dataset.sigImg){sig.image=t.dataset.sigImg;saveSig();syncSigUI();renderSigPreview();return}
  if(t.hasAttribute("data-sig-upload")){const f=$("#sig-file");if(f)f.click();return}
  if(t.hasAttribute("data-sig-photo-dl")){if(sigUpload)saveFile("signature-photo.jpg",dataToBlob(sigUpload));return}
  if(t.dataset.sigCopy){if(t.dataset.sigCopy==="html"){copyText(altNote(imgOut())+"\n"+sigOut(),"signature HTML");return}
    const gmailNote=sig.image==="photo"&&!safeUrl(sig.photoUrl)&&sigUpload;
    copyRich(sigOut(),sigPlain(),gmailNote?"Copied. For Gmail, add a hosted photo URL first.":"Copied the signature. Paste it into your email settings.");return}
  if(t.hasAttribute("data-sig-dl")){saveFile("replay-email-signature.html",sigDoc());return}
  if(t.hasAttribute("data-sig-reset")){sig={...SIG_DEF};sigUpload="";saveSig();$$("[data-sig]").forEach(i=>i.value=sig[i.dataset.sig]||"");syncSigUI();renderSigPreview();toast("Signature reset");return}
  if(t.dataset.copy){copyText(t.dataset.copy,t.dataset.label||"value");return}
  if(t.dataset.color){const v=fmtColor(t.dataset.color,colorFmt);copyText(v,`${t.dataset.name} ${v}`,t.dataset.color);return}
  if(t.dataset.fmt){colorFmt=t.dataset.fmt;$$("[data-fmt]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.fmt===colorFmt));return}
  if(t.hasAttribute("data-copy-css")){copyText(tokensCSS(),"palette CSS");return}
  if(t.hasAttribute("data-copy-json")){copyText(tokensJSON(),"tokens JSON");return}
  if(t.dataset.aiTab!==undefined){setAiTab(+t.dataset.aiTab);return}
  if(t.hasAttribute("data-ai-copy")){const[k,label,,,get]=AI_TABS[aiTab];copyText(get(),label);return}
  if(t.hasAttribute("data-ai-dl")){const[,,,file,get]=AI_TABS[aiTab];saveFile(file,get());return}
  if(t.dataset.dl){download(t.dataset.dl,t);return}
  if(t.dataset.lb!==undefined){lbOpen(+t.dataset.lb);return}
  if(t.dataset.mock!==undefined){saveMock(+t.dataset.mock);return}
  if(t.dataset.lbStep){lbIdx=(lbIdx+ +t.dataset.lbStep+MOCKUPS.length)%MOCKUPS.length;lbRender();return}
  if(t.hasAttribute("data-lb-dl")){saveMock(lbIdx);return}
  if(t.hasAttribute("data-lb-close")){lbClose();return}
  if(t.dataset.tex){const x=TEXTURES.find(r=>r[0]===t.dataset.tex);fetchBlob(x[3]).then(b=>saveFile(x[2],b)).catch(()=>toast("Couldn't load the texture. Try again."));return}
  if(t.dataset.logo){const [key,cw,act]=t.dataset.logo.split("|"),svg=svgOf(key,COLOURWAY[cw]);
    if(act==="copy")copyText(svg,"SVG");else if(act==="svg")saveFile(`replay-${key}-${cw}.svg`,svg);
    else rasterize(svg,2000).then(b=>saveFile(`replay-${key}-${cw}-2000.png`,b)).catch(()=>toast("Couldn't render the PNG"));return}
  if(t.dataset.themeSet){const v=t.dataset.themeSet;if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);
    $$("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===v));return}
});
document.addEventListener("click",e=>{if(e.target.id==="lb"||e.target.classList.contains("lb-stage"))lbClose()});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.sig){sig[el.dataset.sig]=el.value;saveSig();renderSigPreview()}});
document.addEventListener("change",async e=>{const el=e.target;if(el.id!=="sig-file"||!el.files||!el.files[0])return;
  try{sigUpload=await prepPhoto(el.files[0]);sig.image="photo";saveSig();syncSigUI();renderSigPreview();toast("Photo added")}catch(err){toast("Couldn't read that image. Try a JPG or PNG.")}el.value=""});
$("#menu-btn").addEventListener("click",()=>{const o=document.body.classList.toggle("nav-open");$("#menu-btn").setAttribute("aria-expanded",o)});
$("#scrim").addEventListener("click",()=>{document.body.classList.remove("nav-open");$("#menu-btn").setAttribute("aria-expanded","false")});
$("#side-mark").innerHTML=svgOf("signature","currentColor");
$("#tb-mark").innerHTML=svgOf("signature","currentColor");
$("#foot-mark").innerHTML=svgOf("signature","#FFFFFF",'role="img" aria-label="Replay"');
decorate(document);
route();
})();
</script>
